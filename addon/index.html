<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https:; connect-src 'self' https://accounts.google.com https://sheets.googleapis.com https://www.googleapis.com https://*.supabase.co wss://*.supabase.co; frame-src 'self' https://accounts.google.com https://docs.google.com; object-src 'none'; base-uri 'none'">
<title>ACR Helper</title>
<link rel="stylesheet" href="../assets/acr.css?v=0.9.0">
</head>
<body class="panel">
<header>
  <h1>ACR Helper</h1>
  <p id="sub"></p>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<section id="notes" class="notes-box" hidden>
  <div class="small-row"><label for="note-text" class="label">Notes from Admissions</label><button type="button" id="note-open" class="btn small">Write a note</button></div>
  <div id="note-form" hidden>
    <textarea id="note-text" rows="3"></textarea>
    <div class="small-row"><span id="note-status" class="muted"></span><button type="button" id="note-add" class="btn small">Add note</button></div>
  </div>
</section>
<section id="share" class="notes-box" hidden>
  <div class="small-row"><span class="label">People in the review</span><button type="button" id="share-open" class="btn small">Add someone</button></div>
  <form id="share-form" hidden>
    <input id="share-email" type="email" autocomplete="off" placeholder="Their Google account email" aria-label="Email" required>
    <div class="small-row">
      <select id="share-role" aria-label="Access"><option value="reader">Can vote</option><option value="writer">Can vote and edit the sheet</option></select>
      <button type="submit" id="share-add" class="btn small">Add</button>
    </div>
    <p id="share-status" class="muted" role="status"></p>
  </form>
</section>
<footer id="foot" hidden></footer>
<div id="diag" class="diag" hidden></div>
<script src="../assets/config.js?v=0.9.0"></script>
<script src="../assets/acr-lib.js?v=0.9.0"></script>
<script src="../assets/api.js?v=0.9.0"></script>
<script src="../assets/acr-crypto.js?v=0.9.0"></script>
<script src="../assets/acr-session.js?v=0.9.0"></script>
<script src="../assets/realtime.js?v=0.9.0"></script>
<script src="../assets/transport.js?v=0.9.0"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<script src="../assets/panel.js?v=0.9.0"></script>
</body>
</html>
